version: "3"

tasks:
  default:
    desc: Run all tests (unit + E2E)
    cmds:
      - task: test
      - task: test:e2e

  install:
    desc: Install dependencies
    cmds:
      - bun install

  test:
    desc: Run unit tests
    cmds:
      - bun test

  test:e2e:
    desc: Run end-to-end integration test
    cmds:
      - ./scripts/e2e.sh

  typecheck:
    desc: Run TypeScript type checking
    cmds:
      - bun x tsc --noEmit

  clean:
    desc: Remove node_modules and lockfile
    cmds:
      - rm -rf node_modules bun.lock

  rebuild:
    desc: Clean install from scratch
    cmds:
      - task: clean
      - task: install
